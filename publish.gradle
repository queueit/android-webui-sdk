apply plugin: 'maven-publish'
apply plugin: 'signing'

group = groupId
version = libraryVersion

def pomConfig = {
    description libraryDescription
    licenses {
        license {
            name licenseName
            url licenseUrl
        }
    }
    scm {
        connection gitUrl
        developerConnection gitUrl
        url siteUrl
    }
    developers {
        developer {
            name "Developers"
            email "devs@queue-it.com"
            organization organization
            organizationUrl organizationUrl
        }
    }
}

afterEvaluate {
    configurations.all {
        if (it.name =~ /DebugAll(Api|Runtime)Publication$/) {
            components.all.withVariantsFromConfiguration(it) {
                skip()
            }
        }
    }

    publishing.publications {
        android.libraryVariants.all { variant ->
            if (variant.buildType.name == "debug") return // Prevents publishing debug library

            def variantArtifactId = artifact
            def publicationName = "android-webui-sdk-${variant.name.capitalize()}"

            def sourceDirs = variant.sourceSets.collect {
                it.javaDirectories // Also includes kotlin sources if any.
            }
            def sourcesJar = task("${variant.name}SourcesJar", type: Jar) {
                description "Puts sources for ${variant.name} in a jar."
                from sourceDirs
                archiveClassifier = 'sources'
            }

            "$publicationName"(MavenPublication) {
                from components.release
                artifactId variantArtifactId
                group groupId
                version libraryVersion
                artifact sourcesJar

                pom {
                    withXml {
                        def root = asNode()
                        root.appendNode("name", "${libraryName}:${variantArtifactId}")
                        root.appendNode("url", siteUrl)
                        root.appendNode("description", libraryDescription)
                        root.children().last() + pomConfig
                        root.dependencies.removeAll { dep ->
                            dep.scope == "test"
                        }
                        // Create a signed pom if we need it
                        def pomFile = file("${project.buildDir}/generated-${variant.name}-pom.xml")
                        writeTo(pomFile)
                        signing.sign(pomFile)
                    }
                }
            }
        }

        // Relocation stubs: the previous artifact ids (`library`, `library-androidx`)
        // are discontinued and now point to the renamed artifact (`artifact` in
        // build.gradle). Consumers still on the old coordinates get a "relocated"
        // warning at build time and should switch to the new artifact id.
        def newArtifactId = artifact
        def grp = groupId
        def ver = libraryVersion
        def libName = libraryName
        def site = siteUrl
        def scmUrl = gitUrl
        def licName = licenseName
        def licUrl = licenseUrl
        ['library', 'library-androidx'].each { oldArtifactId ->
            def pubName = 'relocation' + oldArtifactId.split('-').collect { it.capitalize() }.join()
            "$pubName"(MavenPublication) {
                groupId = grp
                artifactId = oldArtifactId
                version = ver
                pom {
                    packaging = 'pom'
                    name = "${libName}:${oldArtifactId}"
                    description = "Discontinued: relocated to ${grp}:${newArtifactId}."
                    url = site
                    licenses {
                        license {
                            name = licName
                            url = licUrl
                        }
                    }
                    scm {
                        connection = scmUrl
                        developerConnection = scmUrl
                        url = site
                    }
                    developers {
                        developer {
                            name = 'Developers'
                            email = 'devs@queue-it.com'
                        }
                    }
                    withXml {
                        def rootNode = asNode()
                        def rel = rootNode.appendNode('distributionManagement').appendNode('relocation')
                        rel.appendNode('groupId', grp)
                        rel.appendNode('artifactId', newArtifactId)
                        rel.appendNode('version', ver)
                        rel.appendNode('message', "${grp}:${oldArtifactId} has been renamed to ${grp}:${newArtifactId} as of ${ver}.")
                    }
                }
            }
        }
    }
}

Properties localProps = new Properties()
if (rootProject.file("local.properties").exists()) {
    localProps.load(rootProject.file("local.properties").newDataInputStream())
}

//Sign all of our publications with our PGP private key
signing {
    useInMemoryPgpKeys(PGP_KEY, PGP_PASSWORD)
    publishing.publications.all { publication ->
        sign(publication)
    }
}